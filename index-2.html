<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tab Player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
html { color-scheme: light; } body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }
/* Layout: one column. A sticky deck (transport + fretboard) stays in view while the tab scrolls underneath it. */
:root {
  --bg: #eef1f3; --panel: #ffffff; --ink: #18202a; --muted: #5c6875; --line: #d3d9df;
  --accent: #2f55d4; --accent-ink: #ffffff;
  --hit: #c2410c; --hit-bg: #ffe1cf; --err: #b42318;
  --wood: #4a342b; --wire: #c9ccd1; --string: #eadfc4; --inlay: #d9d2bf; --dot: #ffb020; --dot-ink: #1b1300;
  --paper: #ffffff; --paper-cursor: #2f55d4; --paper-hit: #e8590c;   /* printed pages stay white in both themes */
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --panel: #1b212a; --ink: #e6ebf1; --muted: #94a0ae; --line: #2e3743;
  --accent: #8aa4ff; --accent-ink: #0b1020;
  --hit: #ffa36b; --hit-bg: #4d2b16; --err: #ff8a7a;
  --wood: #3a2922; --wire: #aeb3ba; --string: #eadfc4; --inlay: #b8b09c; --dot: #ffb020; --dot-ink: #1b1300;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1b212a; --ink: #e6ebf1; --muted: #94a0ae; --line: #2e3743;
  --accent: #8aa4ff; --accent-ink: #0b1020;
  --hit: #ffa36b; --hit-bg: #4d2b16; --err: #ff8a7a;
  --wood: #3a2922; --wire: #aeb3ba; --string: #eadfc4; --inlay: #b8b09c; --dot: #ffb020; --dot-ink: #1b1300;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--display); font-size: 1.7rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); max-width: 65ch; }
.mono { font-family: var(--mono); font-size: clamp(12px, 1.6vw, 14px); }

.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
button, .btn { font: 600 14px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { border-color: var(--accent); }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, .btn:focus-within, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
#status { color: var(--muted); min-width: 0; flex: 1 1 220px; }
#status.err { color: var(--err); }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; width: fit-content; }
textarea { width: 100%; height: 190px; margin: 10px 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); white-space: pre; overflow: auto; resize: vertical; }

.deck { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px;
  border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
#play { min-width: 92px; justify-content: center; }
label.ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
label.ctl b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 4.2em; }
input[type="range"] { width: 130px; accent-color: var(--accent); }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
select { font: 14px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }

#board svg { display: block; width: 100%; height: auto; }
#board .wood { fill: var(--wood); }
#board .fret { stroke: var(--wire); stroke-width: 1.6; }
#board .nut { stroke: var(--wire); stroke-width: 5; }
#board .str { stroke: var(--string); }
#board .inlay { fill: var(--inlay); opacity: .55; }
#board text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
#board .dot circle { fill: var(--dot); }
#board .dot text { fill: var(--dot-ink); font-weight: 700; text-anchor: middle; }
#board .dot.off { display: none; }

#tab { display: flex; flex-direction: column; gap: 14px; }
.system { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; min-width: 0; cursor: text; }
.system.live { border-color: var(--accent); }
.inner { position: relative; display: inline-block; white-space: pre; line-height: 1.5; }
.inner > div { min-height: 1.5em; }
.cap { color: var(--muted); }
.n { font-weight: 700; border-radius: 3px; }
.n.on { background: var(--hit-bg); color: var(--hit); box-shadow: 0 0 0 2px var(--hit-bg); }
.ph { position: absolute; left: 0; width: 1ch; background: var(--accent); opacity: .28; border-radius: 2px; pointer-events: none; }
.page { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; max-width: 100%; cursor: pointer; }
.page canvas { display: block; width: 100%; height: 100%; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.ph2 { position: absolute; width: 0.9%; margin-left: -0.45%; background: var(--paper-cursor); opacity: .22; border-radius: 3px; }
.ring { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: var(--paper-hit); opacity: .38; box-shadow: 0 0 0 2px var(--paper-hit); }
#measure { position: absolute; visibility: hidden; white-space: pre; left: -9999px; top: 0; }
.note { color: var(--muted); font-size: 13px; max-width: 70ch; margin: 0; }
@media (max-width: 520px) { input[type="range"] { width: 100px; } h1 { font-size: 1.45rem; } }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.top h1 { font-size: 1.5rem; }
h2 { font-family: var(--display); font-size: 1.15rem; margin: 0; text-wrap: balance; min-width: 0; }
.muted { color: var(--muted); } .err { color: var(--err); }
#who { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
#signin { max-width: 380px; display: flex; flex-direction: column; gap: 8px; }
#signin label, #pwform label { font-size: 14px; font-weight: 600; }
input[type="email"], input[type="password"], input[type="text"], input[type="search"] { font: 15px var(--body); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
#signin .primary { justify-content: center; margin-top: 6px; }
#authmsg { margin: 0; min-height: 1.4em; }
#pwform { gap: 10px; } #pwform label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; } #pwform input { width: 220px; max-width: 100%; }
button.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; }
button.danger { background: var(--err); border-color: var(--err); color: var(--panel); }
button:disabled { opacity: .6; cursor: default; }
.libhead { justify-content: space-between; } .libhead #search { flex: 1 1 180px; max-width: 320px; }
#libmsg { margin: 0; min-height: 1.4em; max-width: 70ch; }
#tablist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
#tablist:empty { display: none; }
.tabrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); }
.tabrow:first-child, .empty:first-child { border-top: 0; }
.tabmain { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 220px; }
.tabmain .open { border: 0; background: none; padding: 2px 0; font-size: 16px; text-align: left; color: var(--ink); overflow-wrap: anywhere; justify-content: flex-start; }
.tabmain .open:hover { color: var(--accent); text-decoration: underline; }
.meta { color: var(--muted); font-size: 13px; } .warn { font-weight: 600; overflow-wrap: anywhere; }
.tabacts { display: flex; gap: 8px; } .tabacts button { padding: 6px 10px; font-size: 13px; }
.empty { padding: 18px 14px; color: var(--muted); }
.playhead { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
section { display: flex; flex-direction: column; gap: 14px; } section[hidden] { display: none; } section.row, section.deck { gap: 10px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Tab Player</h1>
    <div id="account" class="row" hidden>
      <span id="who"></span>
      <button id="pwbtn" type="button">Change password</button>
      <button id="signout" type="button">Sign out</button>
    </div>
  </header>

  <form id="pwform" class="card row" hidden>
    <label for="newpw">New password <input type="password" id="newpw" autocomplete="new-password" minlength="8"></label>
    <button class="primary" type="submit">Save password</button>
    <button type="button" id="pwcancel">Cancel</button>
    <span id="pwmsg" role="status"></span>
  </form>

  <section id="view-auth">
    <form id="signin" class="card">
      <h2>Sign in</h2>
      <p class="sub">Use the email and password set up for the shared library.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" id="signinbtn" type="submit">Sign in</button>
      <p id="authmsg" class="err" role="alert"></p>
    </form>
    <p class="note"><button id="guest" class="link" type="button">Play a file without signing in</button></p>
  </section>

  <section id="view-lib" hidden>
    <div class="row libhead">
      <h2>Library</h2>
      <input id="search" type="search" placeholder="Search tabs" aria-label="Search tabs">
      <label class="btn primary" id="addlabel" for="addfile">Add tabs<input type="file" id="addfile" accept=".pdf,.txt,application/pdf,text/plain" multiple></label>
    </div>
    <p id="libmsg" class="muted" role="status" aria-live="polite"></p>
    <ul id="tablist"></ul>
  </section>

  <section id="view-player" hidden>
    <div class="playhead">
      <button id="back" type="button">&larr; Library</button>
      <h2 id="nowplaying"></h2>
    </div>
    <div class="row" aria-label="Open a file">
      <label class="btn" for="file">Play a file from this device<input type="file" id="file" accept=".pdf,.txt,application/pdf,text/plain"></label>
      <span id="status" role="status" aria-live="polite"></span>
    </div>

    <details id="editor">
      <summary>Edit or paste tab text</summary>
      <textarea id="tabtext" class="mono" spellcheck="false" aria-label="Tab text"></textarea>
      <button id="loadtext" type="button">Load this text</button>
    </details>

    <div class="deck" aria-label="Playback">
      <div class="row">
        <button id="play" class="primary" type="button">Play</button>
        <button id="stop" type="button">Back to start</button>
        <label class="ctl" for="bpm">Tempo <input type="range" id="bpm" min="30" max="220" value="80"><b id="bpmv">80 BPM</b></label>
        <label class="ctl" id="divctl" for="div">One dash is
          <select id="div"><option value="4" selected>a 16th note</option><option value="2">an 8th note</option><option value="1">a quarter note</option></select>
        </label>
        <label class="ctl" id="beatsctl" for="beats" hidden>Beats per bar
          <select id="beats"><option value="0" selected>Auto</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="6">6</option></select>
        </label>
        <label class="ctl" id="repctl" for="reps" hidden><input type="checkbox" id="reps" checked>Repeats</label>
        <label class="ctl" for="countin"><input type="checkbox" id="countin" checked>Count-in</label>
        <label class="ctl" for="metro"><input type="checkbox" id="metro">Metronome</label>
        <label class="ctl" for="loop"><input type="checkbox" id="loop">Loop</label>
      </div>
      <div id="board"></div>
    </div>

    <div id="tab" aria-label="Tab"></div>
    <p class="note" id="note"></p>
  </section>
</div>
<span id="measure" class="mono">0000000000000000000000000000000000000000</span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

<script>
/* ---------- Tab parser (no DOM) ---------- */
var SAMPLE = [
"Example: arpeggios and a lick in E minor",
"e|--------0-------|--------0-------|--------3-------|------2-------2-|",
"B|------0---0-----|------1---1-----|------0---0-----|----3---3---3---|",
"G|----0-------0---|----0-------0---|----0-------0---|--2-------2-----|",
"D|--2-----------2-|--2-----------2-|--0-----------0-|0---------------|",
"A|----------------|3---------------|----------------|----------------|",
"E|0---------------|----------------|3---------------|----------------|",
"",
"e|12--15--12------|----------------|----------------|0---------------|",
"B|------------15--|12--15--12------|----------------|0---------------|",
"G|----------------|------------14--|12--14--12------|0---------------|",
"D|----------------|----------------|------------14--|2---------------|",
"A|----------------|----------------|----------------|2---------------|",
"E|----------------|----------------|----------------|0---------------|"
].join("\n");

var PC = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
var STD = { 4: [43, 38, 33, 28], 5: [43, 38, 33, 28, 23], 6: [64, 59, 55, 50, 45, 40], 7: [64, 59, 55, 50, 45, 40, 35], 8: [64, 59, 55, 50, 45, 40, 35, 30] };
var TAB_RE = /^\s*(?:[A-Ga-g][#b]?)?\s*[|:\]]?[-\d|hpbrsxXtvPH\/\\~()^<>=*.: ]+$/;
var PRE_RE = /^\s*(?:[A-Ga-g][#b]?)?\s*[|:\]]?/;
var LABEL_RE = /^\s*([A-Ga-g][#b]?)(?=\s*[|:\]\-])/;

function isTabLine(s) {
  if (!TAB_RE.test(s)) return false;
  var d = (s.match(/-/g) || []).length;
  return d >= 4 && d >= s.trim().length * 0.35;
}

function makeBlock(ls, captions) {
  var n = ls.length, std = STD[n] || STD[6];
  var start = Math.max.apply(null, ls.map(function (s) { return s.match(PRE_RE)[0].length; }));
  var len = Math.max.apply(null, ls.map(function (s) { return s.length; }));
  var tuning = ls.map(function (s, i) {
    var base = std[i] !== undefined ? std[i] : 40, m = s.match(LABEL_RE);
    if (!m) return base;
    var pc = PC[m[1][0].toLowerCase()] + (m[1][1] === "#" ? 1 : m[1][1] === "b" ? -1 : 0);
    return base + ((pc - base % 12 + 18 + 120) % 12) - 6;
  });
  var notesAt = {}, notesByLine = ls.map(function () { return []; }), maxFret = 0, count = 0;
  ls.forEach(function (s, li) {
    var c = start;
    while (c < s.length) {
      var ch = s[c];
      if (ch >= "0" && ch <= "9") {
        var w = 1, fret = +ch, nx = s[c + 1];
        if (nx >= "0" && nx <= "9" && +(ch + nx) >= 10 && +(ch + nx) <= 24) { fret = +(ch + nx); w = 2; }
        var note = { line: li, col: c, w: w, fret: fret, midi: tuning[li] + fret, el: null };
        (notesAt[c] = notesAt[c] || []).push(note);
        notesByLine[li].push(note);
        if (fret > maxFret) maxFret = fret;
        count++; c += w;
      } else c++;
    }
  });
  var steps = [], sinceBar = 0;
  for (var c = start; c < len; c++) {
    var bars = 0, others = 0;
    for (var l = 0; l < n; l++) { if (c < ls[l].length) { if (ls[l][c] === "|") bars++; else others++; } }
    if (bars > 0 && others === 0) { sinceBar = 0; continue; }
    steps.push({ col: c, notes: notesAt[c] || [], sinceBar: sinceBar });
    sinceBar++;
  }
  while (steps.length && !steps[steps.length - 1].notes.length && steps[steps.length - 1].sinceBar === 0) steps.pop();
  return { lines: ls, captions: captions, tuning: tuning, notesByLine: notesByLine, steps: steps, maxFret: maxFret, count: count };
}

function parseTab(text) {
  var lines = text.replace(/\r/g, "").replace(/\t/g, "    ").split("\n").map(function (s) {
    return s.replace(/[‐-―−]/g, "-").replace(/ /g, " ").replace(/\s+$/, "");
  });
  var blocks = [], i = 0;
  while (i < lines.length) {
    if (!isTabLine(lines[i])) { i++; continue; }
    var j = i;
    while (j < lines.length && isTabLine(lines[j])) j++;
    var n = j - i;
    if (n >= 4) {
      var size = n <= 8 ? n : (n % 6 === 0 ? 6 : n % 4 === 0 ? 4 : 6);
      var caps = [];
      for (var k = i - 1; k >= 0 && k >= i - 2 && lines[k].trim() && !isTabLine(lines[k]); k--) caps.unshift(lines[k]);
      for (var s = i; s + size <= j; s += size) {
        var b = makeBlock(lines.slice(s, s + size), s === i ? caps : []);
        if (b.count) blocks.push(b);
      }
    }
    i = j;
  }
  return blocks;
}
if (typeof module !== "undefined") module.exports = { parseTab: parseTab, SAMPLE: SAMPLE };
</script>

<script>
/* ---------- Engraved-PDF tab reader (no DOM) ---------- */
function mul(m, n) { return [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]]; }
function apply(m, x, y) { return [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]]; }

// Pull text items and straight line segments out of one pdf.js page, in top-left page coordinates.
async function getPageData(page, OPS) {
  var vp = page.getViewport({ scale: 1 }), vt = vp.transform;
  var tc = await page.getTextContent(), texts = [];
  tc.items.forEach(function (it) {
    if (!it.str || !it.str.trim()) return;
    var t = mul(vt, it.transform);
    var h = Math.hypot(t[2], t[3]) || it.height, str = it.str.trim();
    if (str.length > 1 && !/[0-9A-Za-z\s]/.test(str)) {   // a run of music symbols: one item per symbol
      for (var q = 0; q < str.length; q++) texts.push({ s: str[q], x: t[4] + it.width * q / str.length, y: t[5], w: it.width / str.length, h: h, font: it.fontName });
    } else texts.push({ s: it.str, x: t[4], y: t[5], w: it.width, h: h, font: it.fontName });
  });
  var ol = await page.getOperatorList(), segs = [], dots = [], beams = [], ctm = [1, 0, 0, 1, 0, 0], stack = [], lw = 1;
  var FILLS = [OPS.fill, OPS.eoFill, OPS.fillStroke, OPS.eoFillStroke, OPS.closeFillStroke, OPS.closeEOFillStroke];
  // a beam is a short thick bar, level or slanted
  function beam(ax, ay, bx, by, th) {
    if (ax > bx) { var t1 = ax; ax = bx; bx = t1; t1 = ay; ay = by; by = t1; }
    if (th >= 1.3 && th <= 5 && bx - ax >= 2.5 && Math.abs(by - ay) < bx - ax) beams.push({ x0: ax, y0: ay, x1: bx, y1: by, th: th });
  }
  function seg(ax, ay, bx, by) {
    var a = apply(vt, ax, ay), b = apply(vt, bx, by), dx = Math.abs(a[0] - b[0]), dy = Math.abs(a[1] - b[1]);
    if (dy < 0.6 && dx > 15) segs.push({ h: 1, p: (a[1] + b[1]) / 2, a: Math.min(a[0], b[0]), b: Math.max(a[0], b[0]) });
    else if (dx < 0.6 && dy > 10) segs.push({ h: 0, p: (a[0] + b[0]) / 2, a: Math.min(a[1], b[1]), b: Math.max(a[1], b[1]) });
  }
  for (var i = 0; i < ol.fnArray.length; i++) {
    var fn = ol.fnArray[i], args = ol.argsArray[i];
    if (fn === OPS.save) stack.push([ctm, lw]);
    else if (fn === OPS.restore) { if (stack.length) { var sv = stack.pop(); ctm = sv[0]; lw = sv[1]; } }
    else if (fn === OPS.transform) ctm = mul(ctm, args);
    else if (fn === OPS.setLineWidth) lw = args[0];
    else if (fn === OPS.paintFormXObjectBegin) { stack.push([ctm, lw]); if (args && args[0]) ctm = mul(ctm, args[0]); }

  $("pwbtn").addEventListener("click", function () { $("pwform").hidden = !$("pwform").hidden; $("pwmsg").textContent = ""; $("newpw").value = ""; if (!$("pwform").hidden) $("newpw").focus(); });
  $("pwcancel").addEventListener("click", function () { $("pwform").hidden = true; });
  $("pwform").addEventListener("submit", async function (e) {
    e.preventDefault();
    var pw = $("newpw").value, msg = $("pwmsg");
    if (pw.length < 8) { msg.textContent = "Use at least 8 characters."; msg.className = "err"; return; }
    var r = await sb.auth.updateUser({ password: pw });
    msg.textContent = r.error ? explain(r.error) : "Password changed."; msg.className = r.error ? "err" : "muted";
    if (!r.error) $("newpw").value = "";
  });
  $("guest").addEventListener("click", function () { view("player"); });
  $("back").addEventListener("click", function () { view(session ? "lib" : "auth"); });
  $("search").addEventListener("input", renderList);
  $("addfile").addEventListener("change", function (e) { var fs = e.target.files; if (fs && fs.length) addFiles(fs); e.target.value = ""; });

  if (window.supabase && window.supabase.createClient) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    $("view-auth").hidden = true;         // wait for the saved sign-in (if any) before choosing a screen
    sb.auth.onAuthStateChange(function (event, s) { setTimeout(function () { onSession(s); }, 0); });
    setTimeout(function () { if (!booted) onSession(null); }, 4000);
  } else {
    view("auth"); $("authmsg").textContent = "The sign-in service didn't load. Check your connection and reload the page.";
  }

  window.__player = { handleFile: handleFile, state: function () { return { mode: mode, items: items.length, total: total, pos: pos, shown: shownItem, playing: playing, rings: rings.length }; },
    beats: function (n) { return items.filter(function (i) { return i.vis >= 0; }).slice(0, n).map(function (i) { return +i.beat.toFixed(3); }); }, countIn: countInBeats };

  ta.value = SAMPLE;
  loadText(SAMPLE, "Example tab");
  setStatus("Example tab loaded. Open a file to replace it.");
  $("nowplaying").textContent = "Example tab";
})();
</script>
</body>
</html>
